<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>blox.io - play and publish games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#182033; --panel:rgba(255,255,255,.93); --panel-line:rgba(24,32,51,.16);
  --solid:#ffffff; --accent:#ff4f2e; --accent-ink:#ffffff; --bg:#8fd4ff; --gold:#ffc21a; --shade:rgba(24,32,51,.5);
  --blk:rgba(255,255,255,.35);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef2ff; --solid:#1b2133; --panel:rgba(22,27,42,.92); --panel-line:rgba(255,255,255,.18); --bg:#18223a; --shade:rgba(0,0,0,.6); --blk:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  --ink:#eef2ff; --solid:#1b2133; --panel:rgba(22,27,42,.92); --panel-line:rgba(255,255,255,.18); --bg:#18223a; --shade:rgba(0,0,0,.6); --blk:rgba(255,255,255,.07);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Lilita One','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;
  background-image:linear-gradient(var(--blk) 2px,transparent 2px),linear-gradient(90deg,var(--blk) 2px,transparent 2px);
  background-size:56px 56px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-weight:400;margin:0}
a{color:inherit}
.sans,.txt,.gd,.by,.bl,.hint,.err{font-family:'Trebuchet MS',system-ui,sans-serif;font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px 12px 8px}
.topin{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);
  border:2px solid var(--panel-line);border-radius:18px;padding:8px 10px;box-shadow:0 4px 0 var(--panel-line);backdrop-filter:blur(6px)}
.logo{display:flex;gap:3px;align-items:center;background:none;border:none;padding:0}
.lt{display:inline-block;width:26px;height:32px;line-height:32px;font-size:20px;color:#182033;text-align:center;border-radius:8px;
  border:2px solid rgba(0,0,0,.2);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.lt.dot{width:14px;background:transparent;border:none;box-shadow:none;color:var(--ink)}
.srch{flex:1;min-width:140px}
.txt{width:100%;font:inherit;font-size:18px;padding:9px 12px;border-radius:12px;border:2px solid var(--panel-line);background:var(--solid);color:var(--ink)}
.txt::placeholder{opacity:.55}
textarea.txt{font-size:14px;min-height:150px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-weight:500}
textarea.desc{font-family:'Trebuchet MS',system-ui,sans-serif;font-size:16px;min-height:80px;font-weight:600}
.chip{background:var(--panel);border:2px solid var(--panel-line);border-radius:12px;padding:5px 12px;font-size:18px;box-shadow:0 3px 0 var(--panel-line);white-space:nowrap}
button.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--panel-line)}
.big{background:var(--accent);color:var(--accent-ink);border:3px solid rgba(0,0,0,.2);border-radius:14px;padding:12px 30px;font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.big:disabled{opacity:.5;cursor:not-allowed}
.sec{background:var(--panel);color:var(--ink);border:3px solid var(--panel-line);border-radius:14px;padding:10px 22px;font-size:20px;box-shadow:0 4px 0 var(--panel-line)}
.sec:active{transform:translateY(3px);box-shadow:0 1px 0 var(--panel-line)}
.sm{padding:6px 14px;font-size:16px;border-radius:12px}
.pub{padding:8px 16px;font-size:18px}

main{max-width:1100px;margin:0 auto;padding:6px 12px 40px}
.sectitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.sectitle h2{font-size:28px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:0;background:var(--solid);border:2px solid var(--panel-line);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--panel-line)}
.hero .thumb{min-height:240px;border-radius:0;border:none;border-right:2px solid var(--panel-line)}
.hero .thumb .ic{font-size:96px}
.hero .hb{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.05}
.hero p{margin:0;font-size:17px;line-height:1.35;opacity:.9}
.pill{align-self:flex-start;background:var(--gold);color:#182033;border-radius:8px;padding:2px 10px;font-size:14px}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero .thumb{border-right:none;border-bottom:2px solid var(--panel-line);min-height:170px}}

/* chips + tabs */
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.tab{flex:none;background:var(--panel);color:var(--ink);border:2px solid var(--panel-line);border-radius:12px;padding:8px 14px;font-size:18px;box-shadow:0 3px 0 var(--panel-line)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:rgba(0,0,0,.2)}
.sorts{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.gcard{background:var(--solid);border:2px solid var(--panel-line);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--panel-line);cursor:pointer;display:flex;flex-direction:column}
.gcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--panel-line)}
.thumb{position:relative;aspect-ratio:16/10;background:var(--c);display:grid;place-items:center;overflow:hidden;
  border-bottom:2px solid var(--panel-line)}
.thumb::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.16) 3px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.16) 3px,transparent 3px);background-size:34px 34px}
.thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.22))}
.thumb .ic{position:relative;z-index:1;font-size:52px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.gi{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gt{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by{font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs{display:flex;gap:10px;align-items:center;font-size:15px;margin-top:5px;flex-wrap:wrap}
.badge{display:inline-block;background:var(--gold);color:#182033;border-radius:6px;padding:0 7px;font-size:12px}
.mine{display:flex;gap:6px;padding:0 12px 12px}
.mine .sec{flex:1;padding:5px 8px;font-size:15px}
.empty{background:var(--panel);border:2px dashed var(--panel-line);border-radius:18px;padding:30px 16px;text-align:center;font-size:20px}
.empty p{font-size:15px;margin:6px 0 14px;opacity:.8}

/* game page */
.back{margin:8px 0 10px}
.player{position:relative;width:100%;height:clamp(360px,72vh,740px);background:#101626;border:3px solid var(--panel-line);border-radius:20px;overflow:hidden;box-shadow:0 6px 0 var(--panel-line)}
.player iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cover .thumb{position:absolute;inset:0;aspect-ratio:auto;border:none}
.cover .thumb .ic{font-size:120px}
.cover .big{position:relative;z-index:2;font-size:32px;padding:14px 44px}
.player.theater{position:fixed;inset:0;z-index:60;height:auto;border-radius:0;border:none}
.xT{display:none;position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px)}
.player.theater .xT{display:block}
.gbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 8px}
.gbar .ttl{flex:1;min-width:200px}
.gbar h1{font-size:clamp(28px,5vw,40px);line-height:1.05}
.gbar .by{font-size:15px}
.by a,.lnk{cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font:inherit;color:inherit}
.heart.on{background:var(--accent);color:var(--accent-ink);border-color:rgba(0,0,0,.2)}
.box{background:var(--solid);border:2px solid var(--panel-line);border-radius:18px;padding:16px;box-shadow:0 5px 0 var(--panel-line);margin-top:14px}
.box h3{font-size:24px;margin-bottom:8px}
.gd{font-size:16px;line-height:1.45;margin:0;white-space:pre-wrap;word-wrap:break-word}
.cm{border-top:2px solid var(--panel-line);padding:10px 0;display:flex;gap:10px}
.cm:first-of-type{border-top:none}
.av{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#182033;font-size:19px;border:2px solid rgba(0,0,0,.2)}
.cm .tx{font-family:'Trebuchet MS',system-ui,sans-serif;font-weight:600;font-size:15px;line-height:1.35;word-wrap:break-word;min-width:0}
.cm b{font-weight:400;font-size:17px;display:block}
.cm small{opacity:.6;font-size:12px;margin-left:6px}
.crow{display:flex;gap:8px;margin-top:10px}

/* forms */
.card{width:min(640px,100%);margin:10px auto;background:var(--solid);border:2px solid var(--panel-line);border-radius:20px;padding:22px 22px 24px;box-shadow:0 6px 0 var(--panel-line)}
.card h1{font-size:36px;line-height:1.05;margin-bottom:6px}
.lbl{display:block;font-size:17px;margin:16px 0 6px;opacity:.9}
.hint{font-size:13px;opacity:.75;margin:4px 0 0;line-height:1.35}
.err{color:#e03131;min-height:20px;font-size:15px;margin:10px 0 0;font-weight:700}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:10px;border:3px solid var(--panel-line);padding:0}
.sw[aria-checked="true"]{border-color:var(--ink);transform:translateY(-3px)}
.icons{display:flex;gap:8px;flex-wrap:wrap}
.ib{width:44px;height:44px;border-radius:12px;border:3px solid var(--panel-line);background:var(--panel);font-size:24px;padding:0}
.ib[aria-checked="true"]{border-color:var(--ink);transform:translateY(-3px)}
.pv{width:210px;max-width:100%;margin:6px 0 0;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice{background:var(--gold);color:#182033;border-radius:12px;padding:8px 12px;font-size:14px;margin-top:10px;font-family:'Trebuchet MS',system-ui,sans-serif;font-weight:700;line-height:1.35}
input[type=file]{display:none}

/* profile */
.phead{display:flex;gap:14px;align-items:center;background:var(--solid);border:2px solid var(--panel-line);border-radius:20px;padding:16px;box-shadow:0 5px 0 var(--panel-line);margin-top:8px;flex-wrap:wrap}
.phead .av{width:64px;height:64px;font-size:34px;border-radius:16px}
.phead h1{font-size:34px}
.pst{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}

/* modal + toast */
.ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--shade);z-index:80;overflow-y:auto}
.ov[hidden]{display:none}
.ov>*{margin:auto}
.mcard{width:min(440px,100%);background:var(--solid);border:2px solid var(--panel-line);border-radius:20px;padding:24px;box-shadow:0 6px 0 var(--panel-line);text-align:center}
.mcard h2{font-size:32px;margin-bottom:8px}
.mcard p{margin:0 0 14px;font-size:16px;line-height:1.35;font-family:'Trebuchet MS',system-ui,sans-serif;font-weight:600}
.mcard.wide{width:min(900px,100%)}
.mframe{width:100%;height:min(60vh,520px);border:3px solid var(--panel-line);border-radius:14px;background:#fff;margin:6px 0 14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,8px);opacity:0;z-index:100;transition:opacity .2s,transform .2s;pointer-events:none;
  text-align:center;white-space:normal;max-width:min(92vw,420px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;margin:30px 0 0;font-size:14px;opacity:.75}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.thumb .ic{font-size:40px}.gt{font-size:17px}.card{padding:18px 16px 20px}.lt{width:22px;height:28px;line-height:28px;font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main id="app"></main>
<div class="ov" id="modal" hidden></div>
<div class="chip" id="toast" role="status"></div>

/* ---------- data helpers ---------- */

  S.likes.forEach(function(l){st.likes[l.gid]=(st.likes[l.gid]||0)+1;if(S.me&&l.uid===S.me.id)st.liked[l.gid]=true});

  var score=function(g){var s=stat(g);return s.likes*3+s.plays+((now-g.created)<6048e5?4:0)};
  if(S.sort==='new')f.sort(function(a,b){return b.created-a.created});

  else if(S.sort==='played')f.sort(function(a,b){return stat(b).plays-stat(a).plays||b.created-a.created});

   '<div class="gi"><div class="gt">'+esc(g.title)+'</div><div class="by">by '+esc(nameOf(g.authorId))+'</div>'+
   '<div class="gs"><span title="players">▶ '+num(s.plays)+'</span><span title="likes">♥ '+num(s.likes)+'</span><span class="badge">'+esc(cat)+'</span></div></div>'+
   (mine?'<div class="mine"><button class="sec" data-a="edit" data-id="'+esc(g.id)+'">Edit</button><button class="sec" data-a="del" data-id="'+esc(g.id)+'">Delete</button></div>':'')+'</div></div>';
}
function avatar(id,sz){
  var n=nameOf(id)||'?',cols=['#ff8fc7','#ffd166','#9be7ff','#c3aaff','#8cf0b0','#ff9f80'],h=0,i;
  for(i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;
  return '<div class="av" style="background:'+cols[h%cols.length]+'">'+esc(n.charAt(0).toUpperCase())+'</div>';
}
function dark(){var r=document.documentElement,t=r.getAttribute('data-theme');if(t)return t==='dark';return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}

/* ---------- views ---------- */
function drawTop(){
  var logo=LOGO.map(function(l){return l[1]?'<span class="lt" style="background:'+l[1]+'">'+l[0]+'</span>':'<span class="lt dot">.</span>'}).join('');
  $('top').innerHTML='<button class="logo" data-a="home" aria-label="blox.io home">'+logo+'</button>'+
   '<div class="srch"><input class="txt" id="q" type="search" placeholder="Search games, players..." value="'+esc(S.q)+'" autocomplete="off"></div>'+
   '<button class="big pub" data-a="publish">+ Publish</button>'+
   (S.me?'<button class="chip" data-a="profile" data-id="'+esc(S.me.id)+'">'+esc(S.me.name||'Me')+'</button>':'<button class="chip" data-a="signin">Sign in</button>')+
   '<button class="chip" data-a="theme" aria-label="Toggle theme">'+(dark()?'☀️':'🌙')+'</button>';
}
function viewHome(){
  var hero=SEEDS[0],f=filtered(),all=allGames();
  var cats=['All'].concat(CATS).map(function(c){return '<button class="tab'+(S.cat===c?' on':'')+'" data-a="cat" data-v="'+c+'">'+c+'</button>'}).join('');
  var sorts=[['trending','🔥 Trending'],['new','✨ Newest'],['liked','♥ Top liked'],['played','▶ Most played']].map(function(s){return '<button class="tab'+(S.sort===s[0]?' on':'')+'" data-a="sort" data-v="'+s[0]+'">'+s[1]+'</button>'}).join('');
  var showHero=!S.q&&S.cat==='All';
  return (showHero?'<section class="hero">'+thumb(hero)+'<div class="hb"><span class="pill">Featured</span><h1>'+esc(hero.title)+'</h1><p class="sans">'+esc(hero.desc)+'</p>'+
    '<div class="row"><button class="big" data-a="open" data-id="'+hero.id+'" data-go="1">▶ Play now</button><button class="sec" data-a="publish">Publish yours</button></div></div></section>':'')+
   '<div class="sectitle"><h2>'+(S.q?'Results for "'+esc(S.q)+'"':'All games')+'</h2><span class="chip" id="cnt">'+f.length+' of '+all.length+'</span></div>'+
   '<div class="cats">'+cats+'</div><div class="sorts">'+sorts+'</div><div id="grid">'+gridHtml(f)+'</div>'+
   '<p class="foot">blox.io - play it, build it, publish it.</p>';
}
function gridHtml(f){
  if(!f.length)return '<div class="empty">No games found<p>Try another search or category - or publish the first one!</p><button class="big" data-a="publish">+ Publish a game</button></div>';
  return '<div class="grid">'+f.map(function(g){return card(g,false)}).join('')+'</div>';
}
function viewGame(){
  var g=byId(S.route.id);
  if(!g)return '<div class="back"><button class="sec sm" data-a="back">← Back</button></div><div class="empty">That game is gone<p>It may have been deleted by its creator.</p><button class="big" data-a="home">Browse games</button></div>';
  var more=sorted(allGames().filter(function(x){return x.id!==g.id})).slice(0,4);
  return '<div class="back"><button class="sec sm" data-a="back">← Back</button></div>'+
   '<div class="player" id="player"><button class="chip xT" data-a="exitT">✕ Exit full screen</button><div class="cover" id="cover">'+thumb(g)+'<button class="big" data-a="play">▶ Play</button></div></div>'+
   '<div id="gmeta">'+gameMeta(g)+'</div>'+
   '<div class="sectitle"><h2>More games</h2></div><div class="grid">'+more.map(function(x){return card(x,false)}).join('')+'</div>';
}
function gameMeta(g){
  var s=stat(g),liked=!!S.st.liked[g.id],cat=CATS.indexOf(g.cat)>=0?g.cat:'Other';
  var cms=S.comments.filter(function(c){return c.gid===g.id}).sort(function(a,b){return b.created-a.created});
  var mineG=!g.seed&&myId()&&g.authorId===myId();
  return '<div class="gbar"><div class="ttl"><h1>'+esc(g.title)+'</h1><div class="by">by <button class="lnk" data-a="profile" data-id="'+esc(g.authorId)+'">'+esc(nameOf(g.authorId))+'</button> · '+esc(ago(g.created))+'</div></div>'+
   '<span class="chip">▶ '+num(s.plays)+' players</span><button class="chip heart'+(liked?' on':'')+'" data-a="like" data-id="'+esc(g.id)+'">♥ '+num(s.likes)+'</button>'+
   '<button class="chip" data-a="theater">⛶ Full screen</button>'+(mineG?'<button class="chip" data-a="edit" data-id="'+esc(g.id)+'">Edit</button>':'')+'</div>'+
   '<div class="box"><h3>About <span class="badge" style="vertical-align:middle">'+esc(cat)+'</span></h3><p class="gd">'+esc(g.desc||'No description yet.')+'</p></div>'+
   '<div class="box"><h3>Comments ('+cms.length+')</h3>'+
   (cms.length?cms.slice(0,50).map(function(c){return '<div class="cm">'+avatar(c.uid||'x')+'<div class="tx"><b>'+esc(nameOf(c.uid))+'<small>'+esc(ago(c.created))+'</small>'+(myId()&&c.uid===myId()?' <button class="lnk" style="font-size:12px" data-a="delcm" data-id="'+esc(c.id)+'">delete</button>':'')+'</b>'+esc(c.text)+'</div></div>'}).join(''):'<p class="hint">No comments yet. Be the first!</p>')+
   '<div class="crow"><input class="txt" id="cmt" maxlength="240" placeholder="Say something nice..." autocomplete="off"><button class="big sm" data-a="post" data-id="'+esc(g.id)+'">Post</button></div></div>';
}
function newForm(){return {id:null,title:'',cat:'Arcade',desc:'',icon:'🎮',color:'#74c0fc',code:'',created:0}}
function viewPublish(){
  var f=S.form||(S.form=newForm()),editing=!!f.id;
  var cats=CATS.map(function(c){return '<button class="tab'+(f.cat===c?' on':'')+'" data-a="fcat" data-v="'+c+'">'+c+'</button>'}).join('');
  var icons=ICONS.map(function(i){return '<button class="ib" role="radio" aria-checked="'+(f.icon===i)+'" data-a="ficon" data-v="'+i+'">'+i+'</button>'}).join('');
  var cols=COLORS.map(function(c){return '<button class="sw" role="radio" aria-checked="'+(f.color===c)+'" aria-label="Color '+c+'" style="background:'+c+'" data-a="fcol" data-v="'+c+'"></button>'}).join('');
  return '<div class="back"><button class="sec sm" data-a="back">← Back</button></div><div class="card"><h1>'+(editing?'Edit your game':'Publish a game')+'</h1>'+
   '<p class="gd">Paste the code of a single-file HTML game (or upload the .html file). It shows up on the store right away.</p>'+
   (S.backend==='local'&&S.ready?'<div class="notice">Heads up: shared publishing is not available in this view, so games you publish are saved only in this browser.</div>':'')+
   (S.backend==='shared'&&S.canWrite===false?'<div class="notice">You have view-only access to this page, so you can play but not publish.</div>':'')+
   '<label class="lbl" for="ft">Game name</label><input class="txt" id="ft" maxlength="32" placeholder="e.g. Lava Jumpers" value="'+esc(f.title)+'">'+
   '<span class="lbl">Category</span><div class="cats" style="flex-wrap:wrap">'+cats+'</div>'+
   '<label class="lbl" for="fd">Description</label><textarea class="txt desc" id="fd" maxlength="400" placeholder="What is it about? How do you play?">'+esc(f.desc)+'</textarea>'+
   '<span class="lbl">Icon</span><div class="icons" role="radiogroup">'+icons+'</div>'+
   '<span class="lbl">Color</span><div class="swatches" role="radiogroup">'+cols+'</div>'+
   '<span class="lbl">Store card preview</span><div class="pv" id="pv"></div>'+
   '<label class="lbl" for="fc">Game code (HTML)</label><textarea class="txt" id="fc" spellcheck="false" placeholder="&lt;!doctype html&gt; ...">'+esc(f.code)+'</textarea>'+
   '<div class="row" style="margin-top:8px"><label class="sec sm" for="fup" style="cursor:pointer">Upload .html</label><input type="file" id="fup" accept=".html,.htm,text/html"><button class="sec sm" data-a="starter">Use starter game</button><button class="sec sm" data-a="test">▶ Test it</button></div>'+
   '<p class="hint">Single file only (inline your CSS and JS, up to about 200 KB). Games run in a sandbox on blox.io.</p><div class="err" id="ferr"></div>'+
   '<div class="row" style="justify-content:center;margin-top:10px"><button class="big" data-a="submit">'+(editing?'Save changes':'Publish game')+'</button></div></div>';
}
function updatePreview(){var p=$('pv');if(!p||!S.form)return;var f=S.form;p.innerHTML=card({id:'x',title:f.title||'Your game',icon:f.icon,color:f.color,cat:f.cat,authorId:myId()||'you',created:Date.now()},false).replace('data-a="open"','')}
function viewProfile(){
  var id=S.route.id,gs=sorted(allGames().filter(function(g){return g.authorId===id})),mine=myId()===id,pl=0,lk=0;
  gs.forEach(function(g){var s=stat(g);pl+=s.plays;lk+=s.likes});
  return '<div class="back"><button class="sec sm" data-a="back">← Back</button></div>'+
   '<div class="phead">'+avatar(id)+'<div style="flex:1;min-width:160px"><h1>'+esc(nameOf(id))+(mine?' <span class="badge">you</span>':'')+'</h1>'+
   '<div class="pst"><span class="chip">🎮 '+gs.length+' games</span><span class="chip">▶ '+num(pl)+' plays</span><span class="chip">♥ '+num(lk)+'</span></div></div>'+
   (mine?'<button class="big" data-a="publish">+ Publish</button>':'')+'</div>'+
   '<div class="sectitle"><h2>'+(mine?'Your games':'Games')+'</h2></div>'+
   (gs.length?'<div class="grid">'+gs.map(function(g){return card(g,mine&&!g.seed)}).join('')+'</div>':'<div class="empty">No games yet<p>'+(mine?'Publish your first game and it will show up here.':'This player has not published anything yet.')+'</p>'+(mine?'<button class="big" data-a="publish">+ Publish a game</button>':'')+'</div>');
}
function render(){
  drawTop();
  var r=S.route,h='';
  if(r.n==='game')h=viewGame();else if(r.n==='publish')h=viewPublish();else if(r.n==='profile')h=viewProfile();else h=viewHome();
  $('app').innerHTML=h;
  if(r.n==='publish')updatePreview();
  if(r.n!=='game')S.playing=null;
}
function refresh(){
  /* data changed: update only the parts that do not hold form input or a running game */
  var r=S.route;drawTopKeep();
  if(r.n==='home'){var g=$('grid');if(g){var f=filtered();g.innerHTML=gridHtml(f);var c=$('cnt');if(c)c.textContent=f.length+' of '+allGames().length}}
  else if(r.n==='game'){var gm=$('gmeta'),gg=byId(r.id);if(gm&&gg){var keep=$('cmt')?$('cmt').value:'',had=document.activeElement&&document.activeElement.id==='cmt';gm.innerHTML=gameMeta(gg);if($('cmt')){$('cmt').value=keep;if(had)$('cmt').focus()}}else if(!gg)render()}
  else if(r.n==='profile')render();
}
function drawTopKeep(){
  var q=$('q'),had=document.activeElement===q,v=q?q.value:'';drawTop();var n=$('q');if(n){n.value=v;if(had)n.focus()}
}
function go(r,push){if(push!==false)S.stack.push(S.route);S.route=r;render();window.scrollTo(0,0)}

/* ---------- actions ---------- */
function startPlay(){
  var g=byId(S.route.id);if(!g)return;
  var p=$('player'),cv=$('cover');if(!p||!cv)return;
  var f=document.createElement('iframe');
  f.setAttribute('sandbox','allow-scripts allow-pointer-lock');f.setAttribute('allow','fullscreen; gamepad; autoplay');f.title=g.title;
  f.srcdoc=g.code;cv.remove();p.appendChild(f);S.playing=g.id;
  needPlayerId(function(){opPlay(g.id)});
}
function needPlayerId(fn){
  if(S.me){fn();return}
  if(S.backend==='local'&&S.ready){/* anonymous plays are not counted in local mode */return}
}
function setTheater(on){var p=$('player');if(p)p.classList.toggle('theater',on);document.body.style.overflow=on?'hidden':''}
function submitForm(){
  var f=S.form,err=function(m){$('ferr').textContent=m};
  var t=(f.title||'').trim(),d=(f.desc||'').trim(),code=f.code||'';
  if(t.length<2)return err('Give your game a name (2-32 characters).');
  if(d.length<10)return err('Add a short description (at least 10 characters).');
  if(code.trim().length<40)return err('Paste your game code or upload an .html file.');
  var bytes=new Blob([code]).size;
  if(bytes>MAX_BYTES)return err('That file is '+Math.round(bytes/1000)+' KB - the limit is about '+Math.round(MAX_BYTES/1000)+' KB. Inline less or trim it down.');
  if(!/<(html|body|canvas|script|div|h1|p|button|svg)/i.test(code))return err('That does not look like HTML. Paste a full game page.');
  if(!canPost())return;
  needMe(function(){
    var id=f.id||uid('g'),g={id:id,title:t,cat:f.cat,desc:d,icon:f.icon,color:f.color,authorId:myId(),created:f.created||Date.now(),code:code};
    var btn=document.querySelector('[data-a="submit"]');if(btn)btn.disabled=true;
    opPublish(g).then(function(){S.form=null;toast(f.id?'Saved!':'Published! Your game is live.');S.stack=[];S.route={n:'home'};go({n:'game',id:id},false)})
     .catch(function(e){if(btn)btn.disabled=false;dbErr(e)});
  });
}
function openTest(){
  var f=S.form;if(!f||(f.code||'').trim().length<20){$('ferr').textContent='Add some game code first.';return}
  openModal('<div class="mcard wide"><h2>Test play</h2><iframe class="mframe" id="tf" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen; gamepad; autoplay" title="Test play"></iframe><button class="big" data-a="closeModal">Close</button></div>');
  $('tf').srcdoc=f.code;
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
  switch(a){
   case 'home':S.stack=[];S.q='';S.route={n:'home'};render();window.scrollTo(0,0);break;
   case 'back':if(S.route.n==='game')setTheater(false);var p=S.stack.pop();S.route=p||{n:'home'};render();break;
   case 'open':go({n:'game',id:id});if(el.getAttribute('data-go'))startPlay();break;
   case 'play':startPlay();break;
   case 'theater':if(!S.playing)startPlay();setTheater(true);break;
   case 'exitT':setTheater(false);break;
   case 'cat':S.cat=v;render();break;
   case 'sort':S.sort=v;render();break;
   case 'theme':var r=document.documentElement;r.setAttribute('data-theme',dark()?'light':'dark');drawTop();break;
   case 'profile':go({n:'profile',id:id});break;
   case 'signin':needMe(function(){toast('Welcome, '+S.me.name+'!');refresh()});break;
   case 'publish':if(!canPost())break;needMe(function(){S.form=newForm();go({n:'publish'})});break;
   case 'edit':var g=byId(id);if(!g||g.seed||g.authorId!==myId())break;S.form={id:g.id,title:g.title,cat:g.cat,desc:g.desc,icon:g.icon,color:g.color,code:g.code,created:g.created};go({n:'publish'});break;
   case 'del':var dg=byId(id);if(!dg)break;openModal('<div class="mcard"><h2>Delete "'+esc(dg.title)+'"?</h2><p>This removes it from blox.io for everyone. It cannot be undone.</p><div class="row" style="justify-content:center"><button class="sec" data-a="closeModal">Keep it</button><button class="big" data-a="confirmDel" data-id="'+esc(id)+'">Delete</button></div></div>');break;
   case 'confirmDel':closeModal();opDelete(id).then(function(){toast('Game deleted.')}).catch(dbErr);break;
   case 'closeModal':closeModal();S.pending=null;break;
   case 'saveName':saveName();break;
   case 'like':if(!canPost())break;needMe(function(){var on=!S.st.liked[id];opLike(id,on).catch(dbErr)});break;
   case 'post':var inp=$('cmt'),txt=(inp.value||'').trim();if(!txt){toast('Write a comment first.');break}if(!canPost())break;needMe(function(){var i2=$('cmt'),t2=(i2?i2.value:txt).trim();if(!t2)return;opComment(id,t2).then(function(){var i3=$('cmt');if(i3)i3.value=''}).catch(dbErr)});break;
   case 'delcm':opDelComment(id).catch(dbErr);break;
   case 'fcat':S.form.cat=v;render();break;
   case 'ficon':S.form.icon=v;render();break;
   case 'fcol':S.form.color=v;render();break;
   case 'starter':S.form.code=STARTER;if(!S.form.title)S.form.title='Tap Tower';if(!S.form.desc)S.form.desc='Tap the block as fast as you can!';render();break;
   case 'test':openTest();break;
   case 'submit':submitForm();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('modal').hidden)closeModal();else setTheater(false)}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.getAttribute('data-a')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&e.target.id==='cmt'){var b=document.querySelector('[data-a="post"]');if(b)b.click()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.q=t.value;if(S.route.n!=='home'){S.stack=[];S.route={n:'home'};render();var q=$('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}else{var f=filtered(),g=$('grid');if(g)g.innerHTML=gridHtml(f);var c=$('cnt');if(c)c.textContent=f.length+' of '+allGames().length}}
  else if(S.form&&t.id==='ft'){S.form.title=t.value;updatePreview()}
  else if(S.form&&t.id==='fd')S.form.desc=t.value;
  else if(S.form&&t.id==='fc')S.form.code=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;if(t.id!=='fup'||!t.files||!t.files[0])return;
  var file=t.files[0];
  if(file.size>MAX_BYTES){$('ferr').textContent='That file is too big (limit about '+Math.round(MAX_BYTES/1000)+' KB).';return}
  var rd=new FileReader();rd.onload=function(){S.form.code=String(rd.result||'');if(!S.form.title)S.form.title=file.name.replace(/\.[^.]+$/,'').slice(0,32);render()};rd.readAsText(file);
});

/* ---------- boot ---------- */
async function boot(){
  recount();render();
  try{
    var cl=window.claude;
    if(cl&&cl.use){
      var results=await Promise.all([cl.use('db'),cl.use('user')]);
      var db=results[0],user=results[1];
      if(db&&user){
        var id=await user.id();
        if(id){
          var me=await user.me();
          S.backend='shared';S.db=db;S.user=user;S.me={id:id,name:(me&&me.name)||'Player'};S.names[id]=S.me.name;
          try{var cw=await user.can('data.write');S.canWrite=cw!==false}catch(e){}
          subscribe();
        }
      }
    }
  }catch(e){console.warn(e)}
  if(S.backend==='local')loadLocal();
  S.ready=true;recount();render();
}
boot();
})();
</script>
</body>
</html>
